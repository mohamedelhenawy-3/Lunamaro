@if (loadingService.isLoading()) {
  <div class="sp-overlay">
    <div class="sp-card">

      <span class="sp-eyebrow">Please wait</span>

      <div class="sp-orbit-wrap">
        <div class="sp-glow"></div>
        <div class="sp-ring-outer"></div>
        <div class="sp-ring-mid"></div>
        <div class="sp-ring-inner"></div>
        <div class="sp-core"></div>
        <div class="sp-particle sp-particle-1"></div>
        <div class="sp-particle sp-particle-2"></div>
        <div class="sp-particle sp-particle-3"></div>
        <div class="sp-particle sp-particle-4"></div>
      </div>

      <p class="sp-title">Loading</p>
      <div class="sp-divider"></div>

      <div class="sp-bar-wrap">
        <div class="sp-bar-fill"></div>
      </div>

      <span class="sp-label">One moment</span>

    </div>
  </div>
}
