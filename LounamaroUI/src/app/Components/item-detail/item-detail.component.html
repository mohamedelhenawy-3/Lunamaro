<div class="detail-page">

  <!-- ── BACK ────────────────────────────────────────────── -->
  <button class="back-btn" (click)="goBack()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
         stroke-linejoin="round" aria-hidden="true">
      <path d="M19 12H5M12 5l-7 7 7 7"/>
    </svg>
    Back to Menu
  </button>

  <!-- ── MAIN GRID ─────────────────────────────────────────── -->
  <div *ngIf="item && !loading" class="item-grid">

    <!-- LEFT: IMAGE -->
    <div class="image-col">
      <div class="image-shell">

        <img [src]="item.imageUrl"
             [alt]="item.name"
             onerror="this.src='assets/icons/icons-180x180.png'"
             class="item-img">

        <!-- Chef's Choice badge -->
        <div class="badge-chef" *ngIf="item.IsSpecial">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
          </svg>
          Chef's Choice
        </div>

        <!-- Availability pill -->
        <div class="avail-pill" [class.out]="item.quantity === 0">
          <span class="avail-dot"></span>
          {{ item.quantity > 0 ? 'Available' : 'Out of Stock' }}
        </div>

      </div>
    </div>

    <!-- RIGHT: INFO -->
    <div class="info-col">

      <!-- Category -->
      <span class="category-pill">Category #{{ item.categoryId }}</span>

      <!-- Name -->
      <h1 class="item-name">{{ item.name }}</h1>

      <!-- Description -->
      <p class="item-desc">{{ item.description }}</p>

      <!-- Price -->
      <div class="price-row">
        <span class="price-main">{{ item.price }} EGP</span>
      </div>

      <!-- ── QUANTITY ──────────────────────────────────── -->
      <div class="field-block">
        <p class="field-label">Quantity</p>
        <div class="qty-row">
          <div class="qty-control">
            <button class="qty-btn"
                    (click)="changeQty(-1)"
                    [disabled]="quantity <= 1"
                    aria-label="Decrease quantity">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
                <line x1="5" y1="12" x2="19" y2="12"/>
              </svg>
            </button>
            <span class="qty-val">{{ quantity }}</span>
            <button class="qty-btn"
                    (click)="changeQty(1)"
                    [disabled]="quantity >= item.quantity"
                    aria-label="Increase quantity">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
                <line x1="12" y1="5" x2="12" y2="19"/>
                <line x1="5" y1="12" x2="19" y2="12"/>
              </svg>
            </button>
          </div>
          <span class="stock-note" *ngIf="item.quantity > 0 && item.quantity < 20">
            Only <strong>{{ item.quantity }}</strong> left
          </span>
        </div>
      </div>

      <!-- ── ADD TO CART ROW ───────────────────────────── -->
      <div class="cta-row">
        <div class="total-chip">
          <span class="total-chip-label">Total</span>
          <span class="total-chip-val">
            {{ lineTotal | currency:'EGP':'symbol':'1.0-0' }}
          </span>
        </div>

        <button class="add-btn"
                (click)="addToCart()"
                [disabled]="item.quantity === 0 || addingToCart">
          <span class="add-btn-inner" [class.success]="addedSuccess">
            <!-- Default state -->
            <span class="btn-default">
              <svg class="cart-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2" stroke-linecap="round"
                   stroke-linejoin="round" aria-hidden="true">
                <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
                <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
              </svg>
              {{ item.quantity === 0 ? 'Out of Stock' : addingToCart ? 'Adding…' : 'Add to Cart' }}
            </span>
            <!-- Success state -->
            <span class="btn-success" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                   stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"/>
              </svg>
              Added!
            </span>
          </span>
        </button>
      </div>

    </div><!-- /info-col -->
  </div><!-- /item-grid -->

 

</div><!-- /detail-page -->

<!-- ── TOAST ─────────────────────────────────────────────── -->
<div class="toast" [class.show]="showToast" role="status" aria-live="polite">
  <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
       stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
       stroke-linejoin="round" aria-hidden="true">
    <polyline points="20 6 9 17 4 12"/>
  </svg>
  Added to your cart!
</div>
