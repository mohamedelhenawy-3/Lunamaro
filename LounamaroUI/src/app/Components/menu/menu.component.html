<div class="offline-banner-menu" *ngIf="isOffline">
  <i class="ti ti-wifi-off"></i>
  <div>
    <span>Offline mode</span>
    <span class="sub">Showing last saved menu</span>
  </div>
</div>


<!-- Reserve Table Banner -->
<div class="reserve-banner">
  <div class="reserve-banner-content">
    <span class="reserve-icon">🍽️</span>
    <div class="reserve-text">
      <h3>Dining In Tonight?</h3>
      <p>Reserve your table for the perfect experience</p>
    </div>
    <a routerLink="/reservation" class="reserve-cta-btn">
      Reserve a Table
    </a>
  </div>
</div>
<div class="page-container">
  <div class="category-bar">
    <app-category-list
      [categories]="categories"
      (categorySelected)="onCategorySelected($event)">
    </app-category-list>
  </div>

  <div *ngIf="isLoading" class="item-cards">
     <div class="skeleton-grid">
       <div class="skeleton-card" *ngFor="let i of [1,2,3,4,5,6]"></div>
     </div>
  </div>

  <div class="item-cards" *ngIf="!isLoading">
    <app-item-list 
      [items]="items"
      (AddToCartClick)="addtocart($event)"
      [ClassMenu]="'home-item-style'">
    </app-item-list>

    <div class="pagination-wrapper" *ngIf="totalCount > pageSize">
      <button (click)="onPageChange(currentPage - 1)" [disabled]="currentPage === 1">Prev</button>
      <span style="color: aliceblue;">Page {{ currentPage }}</span>
      <button (click)="onPageChange(currentPage + 1)" [disabled]="items.length < pageSize">Next</button>
    </div>
  </div>
</div>
