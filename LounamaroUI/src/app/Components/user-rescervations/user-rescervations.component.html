

<!-- Reserve Table Banner -->



<div class="reservations-container">
  <h2>My Reservations</h2>


   <div class="reserve-banner">
  <div class="reserve-banner-content">
    <span class="reserve-icon">🍽️</span>
    <div class="reserve-text">
      <p>Reserve your table for the perfect experience</p>
    </div>
    <a routerLink="/reservation" class="reserve-cta-btn">
      Reserve a Table
    </a>
  </div>
</div>

  <div *ngIf="userrecervation.length > 0; else noReservations">
    <table class="reservations-table">
      <thead>
        <tr>
          <th>#</th>
          <th>Table Number</th>
          <th>Start Time</th>
          <th>End Time</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let r of userrecervation; index as i">
          <td data-label="#">{{ i + 1 }}</td>
          <td data-label="Table Number">{{ r.tableNumber }}</td>
          <td data-label="Start Time">{{ r.startTime | date: 'short' }}</td>
          <td data-label="End Time">{{ r.endTime | date: 'short' }}</td>
          <td data-label="Status">
            <span class="status" [ngClass]="'status-' + r.status.toLowerCase()">
              {{ r.status }}
            </span>
          </td>
          <td data-label="Action">
            <button class="cancel-btn" (click)="cancelReservation(r.id)">
              Cancel
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <ng-template #noReservations>
    <p class="no-reservations">You have no active reservations.</p>
  </ng-template>
</div>
